<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>نفر سیزدهم</title>
<style>
:root{--bone:#d9d4c3;--ash:#8d9189;--blood:#a3151c;--ink:#07080a;--glass:rgba(12,14,16,.62);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:"Vazirmatn","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif;color:var(--bone);}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#000;}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;}

/* زیرنویس */
#sub{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(760px,72vw);
  text-align:center;font-size:clamp(15px,2.6vw,21px);line-height:1.75;padding:.35em .9em;border-radius:6px;
  background:linear-gradient(rgba(0,0,0,.0),rgba(0,0,0,.55));text-shadow:0 1px 6px #000,0 0 2px #000;opacity:0;transition:opacity .35s;pointer-events:none;z-index:5;}
#sub.on{opacity:1;}
#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);font-size:14px;padding:.4em 1em;border:1px solid rgba(217,212,195,.35);
  background:var(--glass);border-radius:3px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;white-space:nowrap;}
#toast.on{opacity:1;}
#cnt{position:fixed;left:50%;top:max(52px,calc(env(safe-area-inset-top) + 40px));transform:translateX(-50%);font-size:18px;color:#e8e2cc;letter-spacing:.04em;text-shadow:0 0 8px #000;pointer-events:none;z-index:4;}

/* کنترل‌ها */
#hud{display:none;}
#hud.on{display:block;}
.cb{position:fixed;z-index:7;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(14,16,18,.42);border:1.5px solid rgba(217,212,195,.38);backdrop-filter:blur(2px);
  font-size:30px;touch-action:none;transition:background .08s,transform .08s;}
.cb.dn{background:rgba(217,212,195,.26);transform:scale(.94);}
#bL,#bR,#bRun{display:none!important;}


#bBack{right:max(24px,env(safe-area-inset-right));bottom:calc(max(26px,env(safe-area-inset-bottom)) + 104px);width:58px;height:58px;font-size:26px;display:none;border-color:rgba(163,21,28,.8);}
#bBack.on{display:flex;}
#bAct{right:max(24px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:92px;height:92px;font-size:15px;display:none;
  border-color:rgba(232,226,204,.75);background:rgba(40,36,28,.5);flex-direction:column;line-height:1.3;text-align:center;}
#bAct.on{display:flex;}
#actLbl{max-width:80px;font-size:13px;color:var(--bone);}
.mb{position:fixed;top:max(12px,env(safe-area-inset-top));z-index:7;width:46px;height:46px;border-radius:50%;background:rgba(14,16,18,.45);
  border:1.5px solid rgba(217,212,195,.35);display:flex;align-items:center;justify-content:center;font-size:19px;}
#bPause{left:max(14px,env(safe-area-inset-left));}
#bNote{right:max(14px,env(safe-area-inset-right));font-size:13px;}
#prog{position:fixed;left:50%;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 100px);transform:translateX(-50%);width:200px;height:6px;border:1px solid rgba(217,212,195,.5);background:rgba(0,0,0,.5);display:none;z-index:6;}
#prog.on{display:block;}
#progBar{height:100%;width:0;background:var(--bone);}

/* پنل‌ها */
.panel{position:fixed;left:0;top:0;width:100%;height:100%;display:none;z-index:20;}
.panel.on{display:flex;}
#title{flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.35),rgba(0,0,0,.88) 78%);}
#title h1{margin:0;font-size:clamp(54px,12vw,120px);font-weight:900;color:#e9e4d0;letter-spacing:-.01em;line-height:1.05;
  text-shadow:0 0 28px rgba(163,21,28,.55),3px 0 0 rgba(163,21,28,.55),-3px 0 0 rgba(60,120,170,.35);animation:tg 6s infinite steps(1);}
@keyframes tg{0%,92%,100%{transform:none;opacity:1}93%{transform:translateX(-6px) skewX(-6deg);opacity:.85}94%{transform:translateX(5px);opacity:1}96%{transform:none}}
#title .ep{font-size:clamp(15px,2.8vw,22px);color:#a6a99f;margin-bottom:22px;letter-spacing:.08em;text-shadow:0 2px 10px #000;}
#title:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);mix-blend-mode:screen;opacity:.35;}
#title>*{position:relative;z-index:1;}
.mbtn{box-shadow:0 8px 24px rgba(0,0,0,.35);transition:background .18s,border-color .18s,transform .18s;}
.mbtn:hover{background:rgba(163,21,28,.18);border-color:rgba(217,212,195,.85);}
.setting-line{padding:7px 0;border-bottom:1px solid rgba(217,212,195,.08);}
.sbtn:active{background:rgba(163,21,28,.24);}
.mbtn{min-width:210px;padding:.7em 1.4em;font-size:19px;border:1.5px solid rgba(217,212,195,.55);background:rgba(10,10,12,.55);color:var(--bone);border-radius:2px;}
.mbtn:active{background:rgba(217,212,195,.2);}
#btnCont{display:none;}#btnCont.on{display:block;}
#title .warn{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));font-size:13px;color:var(--ash);max-width:80vw;line-height:1.7;}
#card{position:fixed;left:0;top:0;width:100%;height:100%;z-index:19;display:flex;align-items:center;justify-content:center;text-align:center;padding:10vw;
  font-size:clamp(18px,3.4vw,28px);line-height:2;background:#000;opacity:0;transition:opacity .9s;pointer-events:none;white-space:pre-line;color:#cfcab6;}
#card.on{opacity:1;}
body.intro #card{opacity:inherit;}

#note,#keypad,#pause{align-items:center;justify-content:center;background:rgba(0,0,0,.72);}
.box{width:min(620px,90vw);max-height:84vh;overflow:auto;padding:18px 22px;background:#0e1012;border:1px solid rgba(217,212,195,.35);border-radius:3px;text-align:right;}
.box h3{margin:14px 0 8px;font-size:17px;color:#e9e4d0;border-bottom:1px solid rgba(217,212,195,.2);padding-bottom:4px;}
.it{display:flex;flex-direction:column;margin:6px 0;font-size:15px;}.it span{color:var(--ash);font-size:13px;}
.nt{margin:8px 0;font-size:15px;line-height:1.85;padding-right:10px;border-right:2px solid var(--blood);color:#d9d4c3;}
.em{color:var(--ash);font-size:14px;}
#hintBox{margin-top:12px;color:#c9a45b;font-size:15px;line-height:1.8;min-height:1em;}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.sbtn{padding:.5em 1.1em;border:1px solid rgba(217,212,195,.45);font-size:15px;border-radius:2px;background:rgba(255,255,255,.04);}
#keypad .box{width:min(330px,88vw);text-align:center;}
#kpTitle{font-size:17px;margin-bottom:2px;}#kpSub{font-size:13px;color:#c9a45b;min-height:1.4em;margin-bottom:8px;}
#kpDisp{font-size:34px;letter-spacing:.18em;padding:.25em;background:#050607;border:1px solid rgba(217,212,195,.3);margin-bottom:10px;direction:ltr;font-variant-numeric:tabular-nums;}
#kpDisp.shake{animation:sk .35s;}
@keyframes sk{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#kpGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr;}
.kk{padding:.7em 0;font-size:21px;border:1px solid rgba(217,212,195,.35);background:rgba(255,255,255,.04);border-radius:2px;}
.kk:active{background:rgba(217,212,195,.22);}
#pause .box,#settings .box{width:min(440px,90vw);text-align:center;}
#settings{align-items:center;justify-content:center;background:rgba(0,0,0,.84);}
.setting-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;color:var(--bone);font-size:14px}
.setting-line input{width:48%;accent-color:#a3151c}
.setting-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#portrait{display:none;position:fixed;inset:0;z-index:50;background:#050607;color:#e9e4d0;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:20px;line-height:1.9}
@media (orientation:portrait){#portrait{display:flex}}
@media (orientation:landscape){#portrait{display:none}}
#pause .mbtn{display:block;width:100%;margin:8px 0;font-size:17px;}

@media (max-height:480px){.kk{padding:.32em 0;font-size:17px}#kpDisp{font-size:24px;margin-bottom:6px}#keypad .box{padding:10px 16px}#kpGrid{gap:5px}#kpSub{margin-bottom:4px;font-size:12px}#kpTitle{font-size:15px}#keypad .row{margin-top:8px}}
@media (max-height:480px){
#title{gap:6px}#title h1{font-size:clamp(38px,15vh,72px)}#title .ep{margin-bottom:6px;font-size:14px}
.mbtn{min-width:170px;padding:.4em 1.2em;font-size:16px}
#title .warn{position:static;margin-top:4px;font-size:11px;max-width:86vw;line-height:1.5}
#settings .box,#pause .box{padding:8px 16px;max-height:92vh}
#settings h3,#pause h3{margin:2px 0 4px}
.setting-line{margin:5px 0;padding:3px 0}
#pause .mbtn{margin:4px 0;font-size:15px;padding:.35em 1em}
#settings .row{margin-top:6px}
}
/* پایان */
#end{flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:25;text-align:center;}
#endText{width:min(640px,88vw);}
.ln{margin:.35em 0;font-size:clamp(16px,2.8vw,22px);line-height:1.8;animation:lnin .5s;}
.ln.err{color:#e0e0d0;font-family:monospace,Tahoma;animation:lnin .5s,tg 1.2s infinite steps(1);}
.ln.reg{color:#cfc9b0;border-right:2px solid rgba(217,212,195,.3);padding-right:12px;text-align:right;}
.ln.red{color:#d62a32;font-weight:700;text-shadow:0 0 14px rgba(163,21,28,.8);}
.ln.big{font-size:clamp(28px,6vw,52px);font-weight:900;color:#e9e4d0;margin-top:1em;}
.ln.sub2{color:var(--ash);}
@keyframes lnin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#endBtns{display:none;margin-top:26px;}#endBtns.on{display:block;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="sub"></div><div id="toast"></div><div id="cnt"></div>
<div id="hud">
  <button class="mb" id="bPause" aria-label="توقف">II</button>
  <button class="mb" id="bNote" aria-label="دفتر">دفتر</button>
  <button class="cb" id="bL" aria-label="چپ">◀</button>
  <button class="cb" id="bR" aria-label="راست">▶</button>
  <button class="cb" id="bRun">دویدن</button>
  <button class="cb" id="bBack" aria-label="برگرد">↺</button>
  <button class="cb" id="bAct"><span id="actLbl"></span></button>
  <div id="prog"><div id="progBar"></div></div>
</div>
<div id="card"></div>
<div id="title" class="panel">
  <h1>نفر سیزدهم</h1>
  <div class="ep">اپیزود اول: شمارش</div>
  <button class="mbtn" id="btnStart">شروع بازی</button>
  <button class="mbtn" id="btnCont">ادامه</button>
  <button class="mbtn" id="btnSettingsTitle">تنظیمات</button>
  <div class="warn">با هدفون بازی کن. سمت راست برای جلو، سمت چپ برای عقب؛ دوبار لمس و نگه‌داشتن برای دویدن. وسط صفحه را برای تعامل لمس کن.</div>
</div>
<div id="note" class="panel"><div class="box"><div id="noteBody"></div>
  <div class="row"><button class="sbtn" id="btnHint">راهنمایی</button><button class="sbtn" id="btnNoteClose">بستن</button></div></div></div>
<div id="keypad" class="panel"><div class="box"><div id="kpTitle"></div><div id="kpSub"></div><div id="kpDisp"></div><div id="kpGrid"></div>
  <div class="row"><button class="sbtn" id="btnKpClose">بستن</button></div></div></div>
<div id="pause" class="panel"><div class="box"><h3>توقف</h3>
  <button class="mbtn" id="btnResume">ادامه</button>
  <button class="mbtn" id="btnRestart">شروع مجدد</button>
  <button class="mbtn" id="btnFull">تمام‌صفحه</button>
  <button class="mbtn" id="btnSound">صدا: روشن</button>
  <button class="mbtn" id="btnSettingsPause">تنظیمات پیشرفته</button>
  <button class="mbtn" id="btnVib">لرزش: روشن</button>
  <button class="mbtn" id="btnMarks">نشانگر اشیا: روشن</button>
  <button class="mbtn" id="btnMenu">منوی اصلی</button></div></div>
<div id="settings" class="panel"><div class="box"><h3>تنظیمات بازی</h3>
  <div class="setting-line"><label for="volume">میزان صدا</label><input id="volume" type="range" min="0" max="100" value="80" aria-label="میزان صدای بازی"></div>
  <div class="setting-line"><label>کیفیت تصویر</label><div class="setting-actions"><button class="sbtn" id="qLow">اقتصادی</button><button class="sbtn" id="qMed">متعادل</button><button class="sbtn" id="qHigh">بالا</button></div></div>
  <div class="setting-line"><span>لرزش گوشی</span><button class="sbtn" id="btnVibSettings">روشن</button></div>
  <div class="setting-line"><span>نشانگر اشیا</span><button class="sbtn" id="btnMarksSettings">روشن</button></div>
  <div class="row"><button class="mbtn" id="btnSettingsBack">بازگشت</button></div></div></div>
<div id="portrait">برای تجربه‌ی درست بازی، گوشی را به حالت افقی بچرخانید.<br>↻</div>
<div id="end" class="panel"><div id="endText"></div><div id="endBtns"><button class="mbtn" id="btnAgain">بازگشت به منو</button></div></div>
<script>
'use strict';
/* =====================================================
   نفر سیزدهم — اپیزود ۱: شمارش
   ===================================================== */
const H=540,BASE=430,FEET=474;
let S=1,VW=960;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const fa=n=>String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d]);
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

const NAMES=['امیر','بهرام','پویا','جواد','حسین','رضا','نیما','سعید','شاهین','کیان','مهدی','یاسین'];

const G={state:'title',scene:'courtyard',items:{},flags:{},notes:[],counts:{},time:0,
  lock:false,modal:false,paused:false,
  settings:{vibrate:true,mute:false,marks:true,volume:80,quality:'high'}};
const P={x:300,vx:0,dir:1,walk:0,target:null,run:false,step:0,unlock:null};
const cam={x:0};
const FX={shake:0,flash:0,fade:0,fadeDir:0,fadeCb:null,flick:0,off:0,blk:0,scare:null,echo:null,tension:0,glitch:0};
let ambientScareT=22,autoSaveT=0;

/* ---------- تایمر ---------- */
const Timers=[];
function later(s,fn,tag){Timers.push({t:s,fn,tag});}
function cancel(tag){for(let i=Timers.length-1;i>=0;i--)if(Timers[i].tag===tag)Timers.splice(i,1);}
function tickTimers(dt){
  for(let i=0;i<Timers.length;i++){
    const o=Timers[i];o.t-=dt;
    if(o.t<=0){Timers.splice(i,1);i--;try{o.fn();}catch(e){console.error(e);}}
  }
}
function seq(list){let t=0;list.forEach(([d,fn])=>{t+=d;later(t,fn);});}

/* ---------- ذخیره ---------- */
const SAVE='n13_ep1_v1';
function save(){try{localStorage.setItem(SAVE,JSON.stringify({scene:G.scene,items:G.items,flags:G.flags,notes:G.notes,counts:G.counts,x:P.x,dir:P.dir,version:3}));}catch(e){}}
function loadSave(){try{return JSON.parse(localStorage.getItem(SAVE)||'null');}catch(e){return null;}}
function wipeSave(){try{localStorage.removeItem(SAVE);}catch(e){}}
function saveSettings(){try{localStorage.setItem('n13_settings_v1',JSON.stringify(G.settings));}catch(e){}}
function loadSettings(){try{const v=JSON.parse(localStorage.getItem('n13_settings_v1')||'null');if(v&&typeof v==='object'){G.settings={...G.settings,...v};}}catch(e){}}
function vib(p){try{if(G.settings.vibrate&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- متن‌ها و رابط ---------- */
let subT=0;
function say(t,d){const e=$('sub');e.textContent=t;e.className='on';subT=d||Math.max(2.6,t.length*0.075);}
function updSub(dt){if(subT>0){subT-=dt;if(subT<=0)$('sub').className='';}}
function toast(t){const e=$('toast');e.textContent=t;e.className='on';cancel('toast');later(2.8,()=>{e.className='';},'toast');}

const ITEMS={
  key_office:{n:'کلید دفتر مدیر',d:'کلیدی برنجی؛ برچسبش: «دفتر».'},
  key_dorm:{n:'کلید خوابگاه',d:'کلید سنگین با زنجیر؛ برچسب: «خوابگاه».'},
  key_base:{n:'کلید زیرزمین',d:'کلیدی زنگ‌زده. هنوز گرم است.'}
};
const NOTES={
  board:'اطلاعیه‌ی راهرو: «شمارش شبانه ساعت ۹. غیبت ممنوع.» و زیرش: «سیزدهمی را نشمار.»',
  tally:'روی تخته‌ی کلاس: «۱۳ بهمن ۱۳۷۱ — امشب هم می‌شمارمتان.»',
  desks:'در کلاس دوازده میز بود. شمردم. بعد یک میز دیگر ظاهر شد.',
  register:'دفتر حضور و غیاب: دوازده اسم. کنار «نیما»: «اولین غایب — تخت ۷». خط سیزدهم خالی است، ولی جوهرش تازه است.',
  calendar:'تقویم دفتر: بهمن ۱۳۷۱. روز سیزدهم با قرمز دایره شده.',
  safe:'روی گاوصندوق: «سالِ آخرین شمارش».',
  paper:'کاغذ داخل گاوصندوق: «اگر شمردی و یکی اضافه بود، به او نگو که شمرده‌ای.»',
  nima:'زیر بالش نیما: کلیدِ زیرزمین.',
  base:'در انتهای زیرزمین نوشته: «۱۳». قفلِ عددی دارد.',
  tallies:'روی دیوار زیرزمین دوازده ستون خط‌شمارش بود. بعد سیزدهمی پدید آمد: ۱۳.'
};
function addNote(id){
  if(G.notes.includes(id))return;
  G.notes.push(id);toast('یادداشت جدید در دفتر');vib(30);save();
}
function giveItem(id){
  G.items[id]=1;toast('برداشتی: '+ITEMS[id].n);vib(40);save();
}

function hint(){
  const f=G.flags,i=G.items;
  if(!f.inHall)return 'به سمت راست برو و وارد ساختمان شو.';
  if(!f.deskDone&&!i.key_office)return 'کلاس را بگرد. میزها را یکی‌یکی بشمار؛ روی هر میز یک‌بار لمس کن.';
  if(!f.regRead)return 'کلید دفتر را داری. درِ دفتر مدیر را باز کن و دفتر حضور و غیاب را بخوان.';
  if(!i.key_dorm)return 'گاوصندوق دفتر کد چهاررقمی می‌خواهد: «سالِ آخرین شمارش». تاریخ را روی تخته یا تقویم ببین.';
  if(!i.key_base)return 'با کلیدِ خوابگاه وارد شو. دفتر گفته نیما اولین غایب بود؛ تخت شماره‌ی ۷. حواست به عقب باشد.';
  if(!f.inBase)return 'بدو! درِ زیرزمین آخر راهرو است.';
  if(!f.tallyDone)return 'خط‌شمارش‌های دیوار را یکی‌یکی بشمار.';
  if(!f.doorOpen)return 'قفل درِ آخر، شماره‌ی کل را می‌خواهد.';
  return 'وارد اتاق شو.';
}

function deviceInfo(){
  const out={name:'',battery:null};
  const ua=navigator.userAgent||'';
  const m=ua.match(/Android[^;]*;\s*([^;)]+?)\s*(?:Build\/|\))/);
  if(m&&m[1]&&m[1].length>1&&!/^(K|wv|Linux|Mobile)$/i.test(m[1]))out.name=m[1];
  return out;
}

/* =====================================================
   موتور صدا — همه‌ی صداها با کد ساخته می‌شوند
   ===================================================== */
const Snd=(()=>{
  let ac=null,master,rev,nbuf,amb={},muted=false,hbT=0,dripT=3,creakT=8,duckT=0,radio=null;
  let kind='out',tens=0;

  function init(){
    muted=!!G.settings.mute;
    if(ac){if(ac.state==='suspended')ac.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{
      ac=new AC();
      master=ac.createGain();master.gain.value=muted?0:(G.settings.volume/100)*0.9;
      const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=5;
      master.connect(comp);comp.connect(ac.destination);
      nbuf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);
      const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const len=Math.floor(ac.sampleRate*2.4),ir=ac.createBuffer(2,len,ac.sampleRate);
      for(let c=0;c<2;c++){const dd=ir.getChannelData(c);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
      const conv=ac.createConvolver();conv.buffer=ir;const wg=ac.createGain();wg.gain.value=0.5;conv.connect(wg);wg.connect(master);rev=conv;
      buildAmb();
    }catch(e){ac=null;}
  }
  function route(n,send){
    n.connect(master);
    if(send>0&&rev){const g=ac.createGain();g.gain.value=send;n.connect(g);g.connect(rev);}
  }
  function noise(dur,type,f0,f1,vol,send,q,att,pan){
    if(!ac)return;
    const t=ac.currentTime;att=att||0.005;q=q||1;
    const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;
    const f=ac.createBiquadFilter();f.type=type;f.Q.value=q;
    f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+att);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);let o=g;
    if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;g.connect(p);o=p;}
    route(o,send||0);s.start(t,Math.random()*2);s.stop(t+dur+0.05);
  }
  function tone(f0,dur,type,vol,send,f1,att,pan){
    if(!ac)return;
    const t=ac.currentTime;att=att||0.005;
    const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+att);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);let out=g;
    if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;g.connect(p);out=p;}
    route(out,send||0);o.start(t);o.stop(t+dur+0.05);
  }
  function loopNoise(type,freq,q,vol){
    const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;
    const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
    const g=ac.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start();
    return{s,f,g};
  }
  function osc(type,freq,vol,lp){
    const o=ac.createOscillator();o.type=type;o.frequency.value=freq;
    const g=ac.createGain();g.gain.value=vol;
    if(lp){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);f.connect(g);}else o.connect(g);
    g.connect(master);o.start();return{o,g};
  }
  function buildAmb(){
    amb.wind=loopNoise('bandpass',450,0.8,0);
    const l1=ac.createOscillator();l1.frequency.value=0.11;const lg=ac.createGain();lg.gain.value=260;l1.connect(lg);lg.connect(amb.wind.f.frequency);l1.start();
    const l2=ac.createOscillator();l2.frequency.value=0.17;const lg2=ac.createGain();lg2.gain.value=0.025;l2.connect(lg2);lg2.connect(amb.wind.g.gain);l2.start();
    amb.d1=osc('sawtooth',47,0,150);amb.d2=osc('sawtooth',47.7,0,150);
    amb.hum=osc('sine',100,0);amb.hum2=osc('sine',150,0);

  }
  function setKind(k){

    else if(k==='in'){set(amb.wind,0.04);set(amb.d1,0.05);set(amb.d2,0.05);set(amb.hum,0.012);set(amb.hum2,0.006);}
    else{set(amb.wind,0);set(amb.d1,0.08);set(amb.d2,0.08);set(amb.hum,0.014);set(amb.hum2,0.008);}
  }

  }
  function unduck(){
    if(!ac)return;const t=ac.currentTime;master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(muted?0:(G.settings.volume/100)*0.9,t,0.01);duckT=0;
  }
  function update(dt){
    if(!ac)return;
    if(duckT>0){duckT-=dt;if(duckT<=0)unduck();return;}
    if(tens>0.25){hbT-=dt;if(hbT<=0){hbT=lerp(1.1,0.42,tens);heart();}}
    if(kind!=='out'){
      dripT-=dt;if(dripT<=0){dripT=rnd(kind==='base'?1.6:4,kind==='base'?5:11);drip();}
      creakT-=dt;if(creakT<=0){creakT=rnd(9,22);creak(0.5);}
    }
  }
  function heart(){tone(58,0.14,'sine',0.75,0,38,0.004);setTimeout(()=>tone(52,0.18,'sine',0.5,0,34,0.004),170);}
  function drip(){const f=rnd(900,1700);tone(f,0.09,'sine',0.07,0.7,f*0.6,0.002,rnd(-.6,.6));}
  function creak(v){
    if(!ac)return;const t=ac.currentTime,d=rnd(0.7,1.3);
    const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(rnd(90,140),t);o.frequency.linearRampToValueAtTime(rnd(160,260),t+d);
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=rnd(500,900);f.Q.value=9;
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.05*(v||1),t+0.15);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(f);f.connect(g);route(g,0.5);o.start(t);o.stop(t+d+0.05);
  }
  function step(surf,run){
    const v=run?1.4:1;
    if(surf==='snow'){noise(0.16,'bandpass',900,420,0.22*v,0.1,1.2,0.006);noise(0.09,'highpass',3500,2500,0.05,0,1,0.002);}
    else if(surf==='wood'){noise(0.1,'lowpass',420,160,0.5*v,0.35,1,0.003);tone(95,0.09,'sine',0.35*v,0.2,60,0.002);if(Math.random()<0.12)creak(0.4);}
    else{noise(0.07,'bandpass',1500,700,0.28*v,0.5,2,0.002);tone(110,0.07,'sine',0.25*v,0.4,70,0.002);}
  }
  function door(){creak(1.4);noise(0.6,'lowpass',700,200,0.12,0.5,1,0.08);}
  function slam(){noise(0.9,'lowpass',1600,70,1,0.8,0.8,0.002);tone(62,0.7,'sine',1,0.3,26,0.002);}
  function knock(n){for(let i=0;i<(n||2);i++)setTimeout(()=>{tone(170,0.12,'triangle',0.8,0.5,80,0.002);noise(0.1,'lowpass',900,200,0.5,0.5,1,0.002);},i*260);}
  function paper(){noise(0.25,'highpass',2500,6000,0.12,0.1,0.8,0.03);}
  function click(){tone(1400,0.04,'square',0.04,0,900,0.001);}
  function tick(n){tone(330+n*32,0.16,'triangle',0.18,0.5,300+n*30,0.002);noise(0.05,'highpass',3000,5000,0.05,0,1,0.001);}
  function unlock(){tone(900,0.05,'square',0.08,0.3,700,0.001);setTimeout(()=>tone(520,0.12,'square',0.08,0.3,400,0.001),90);setTimeout(()=>noise(0.2,'bandpass',2000,800,0.2,0.4,3,0.002),170);}
  function buzz(){tone(90,0.35,'sawtooth',0.12,0.1,70,0.01);}
  function beep(){tone(1000,0.06,'sine',0.05,0,1000,0.001);}
  function whisper(n,pan){
    for(let i=0;i<(n||4);i++)setTimeout(()=>noise(rnd(0.1,0.25),'bandpass',rnd(1400,3200),rnd(1500,3000),0.13,0.7,5,0.03,pan||rnd(-.7,.7)),i*rnd(120,220));
  }

  }
  function scream(p){
    p=p||1;if(!ac)return;unduck();

    const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(1500,t+0.35);o.frequency.exponentialRampToValueAtTime(900,t+d);

    const f1=ac.createBiquadFilter();f1.type='bandpass';f1.frequency.value=950;f1.Q.value=3;
    const f2=ac.createBiquadFilter();f2.type='bandpass';f2.frequency.value=2600;f2.Q.value=4;
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.45*p,t+0.04);g.gain.exponentialRampToValueAtTime(0.0001,t+d);

  }
  function thump(n){for(let i=0;i<n;i++)setTimeout(()=>{tone(70,0.35,'sine',1,0.6,32,0.002);noise(0.3,'lowpass',500,80,0.5,0.6,1,0.002);},i*420);}
  function radioOn(v){
    if(!ac)return;
    if(!radio){radio=loopNoise('bandpass',1800,2,0);}
    radio.g.gain.setTargetAtTime(v,ac.currentTime,0.05);

  }
  function setMuted(m){muted=m;if(ac)master.gain.setTargetAtTime(m?0:(G.settings.volume/100)*0.9,ac.currentTime,0.05);}
  function setVolume(v){G.settings.volume=clamp(+v||0,0,100);if(ac&&!muted)master.gain.setTargetAtTime((G.settings.volume/100)*0.9,ac.currentTime,0.05);}
  function suspend(){if(ac&&ac.state==='running')ac.suspend();}
  function resume(){if(ac&&ac.state==='suspended')ac.resume();}
  return{init,setKind,setTension,duck,unduck,update,step,door,slam,knock,paper,click,tick,unlock,buzz,beep,whisper,stinger,scream,thump,creak,heart,radioOn,setMuted,setVolume,suspend,resume,get ready(){return !!ac;}};
})();

/* =====================================================
   نقاشی با کد: بافت‌ها، شخصیت‌ها، ترسناک‌ها
   ===================================================== */
const Tex={};
function mkc(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function wrapDraw(x,y,r,w,h,fn){for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const px=x+a*w,py=y+b*h;if(px+r<0||px-r>w||py+r<0||py-r>h)continue;fn(px,py);}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function lin(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>gr.addColorStop(s[0],s[1]));return gr;}
function rad(g,x,y,r0,r1,st){const gr=g.createRadialGradient(x,y,r0,x,y,r1);st.forEach(s=>gr.addColorStop(s[0],s[1]));return gr;}
function ell(g,x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,6.2832);g.fill();}
function fillPat(g,pat,x,y,w,h,a){if(!pat)return;g.save();g.globalAlpha=a;g.fillStyle=pat;g.fillRect(x,y,w,h);g.restore();}

function buildTex(){
  const R=rng(11);let c,g;
  c=mkc(256,256);g=c.getContext('2d');
  for(let i=0;i<70;i++){
    const x=R()*256,y=R()*256,r=10+R()*60,dk=R()<0.7,a=dk?0.03+R()*0.09:0.015+R()*0.04,col=dk?'0,0,0':'255,255,255';
    wrapDraw(x,y,r,256,256,(px,py)=>{g.fillStyle=rad(g,px,py,0,r,[[0,'rgba('+col+','+a+')'],[1,'rgba('+col+',0)']]);g.fillRect(px-r,py-r,r*2,r*2);});
  }
  for(let i=0;i<500;i++){g.fillStyle='rgba(0,0,0,'+(R()*0.12)+')';g.fillRect(R()*256,R()*256,1+R()*2,1+R()*2);}
  Tex.stain=c;
  c=mkc(256,256);g=c.getContext('2d');
  for(let i=0;i<170;i++){
    const y=R()*256,x=R()*256,l=40+R()*170;
    g.strokeStyle='rgba('+(R()<0.55?'0,0,0':'255,225,180')+','+(0.03+R()*0.08)+')';g.lineWidth=0.6+R()*1.6;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+l,y+(R()-0.5)*3);g.stroke();
    if(x+l>256){g.beginPath();g.moveTo(x-256,y);g.lineTo(x+l-256,y+(R()-0.5)*3);g.stroke();}
  }
  Tex.wood=c;
  c=mkc(256,256);g=c.getContext('2d');
  for(let i=0;i<1400;i++){g.fillStyle='rgba('+(R()<0.5?'0,0,0':'255,255,255')+','+(R()*0.1)+')';g.fillRect(R()*256,R()*256,1+R()*3,1+R()*3);}
  for(let i=0;i<6;i++){let x=R()*256,y=R()*256;g.strokeStyle='rgba(0,0,0,0.25)';g.lineWidth=1;g.beginPath();g.moveTo(x,y);for(let k=0;k<14;k++){x+=(R()-0.5)*26;y+=R()*14;g.lineTo(x,y);}g.stroke();}
  Tex.conc=c;
  c=mkc(256,256);g=c.getContext('2d');
  for(let i=0;i<50;i++){const x=R()*256,y=R()*256,r=8+R()*30;wrapDraw(x,y,r,256,256,(px,py)=>{g.fillStyle=rad(g,px,py,0,r,[[0,'rgba(255,255,255,0.12)'],[1,'rgba(255,255,255,0)']]);g.fillRect(px-r,py-r,r*2,r*2);});}
  for(let i=0;i<700;i++){g.fillStyle='rgba(255,255,255,'+(R()*0.2)+')';g.fillRect(R()*256,R()*256,1+R()*2,1+R()*2);}
  Tex.snow=c;
  Tex.grain=[];
  for(let k=0;k<3;k++){
    c=mkc(128,128);g=c.getContext('2d');const id=g.createImageData(128,128);
    for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}
    g.putImageData(id,0,0);Tex.grain.push(c);
  }
}
function makePats(g){
  Tex.pStain=g.createPattern(Tex.stain,'repeat');Tex.pWood=g.createPattern(Tex.wood,'repeat');
  Tex.pConc=g.createPattern(Tex.conc,'repeat');Tex.pSnow=g.createPattern(Tex.snow,'repeat');
  Tex.pGrain=Tex.grain.map(c=>g.createPattern(c,'repeat'));
}

/* ---------- بدنه‌ی مشترک فضای داخلی ---------- */
function interior(g,x0,x1,pal,floorKind){
  const w=x1-x0;
  g.fillStyle=lin(g,0,0,0,80,[[0,pal.c0],[1,pal.c1]]);g.fillRect(x0,0,w,80);
  g.fillStyle=lin(g,0,70,0,BASE,[[0,pal.w0],[1,pal.w1]]);g.fillRect(x0,70,w,BASE-70);
  fillPat(g,Tex.pStain,x0,70,w,BASE-70,0.9);
  g.fillStyle=pal.dado;g.fillRect(x0,300,w,BASE-300);
  fillPat(g,Tex.pStain,x0,300,w,BASE-300,0.8);
  g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x0,298,w,3);g.fillStyle='rgba(255,255,255,.07)';g.fillRect(x0,301,w,1);
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x0,70,w,5);
  g.fillStyle=pal.base;g.fillRect(x0,BASE-9,w,9);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x0,BASE-1,w,2);
  g.fillStyle=lin(g,0,BASE,0,H,[[0,pal.f0],[1,pal.f1]]);g.fillRect(x0,BASE,w,H-BASE);
  fillPat(g,floorKind==='conc'?Tex.pConc:Tex.pWood,x0,BASE,w,H-BASE,floorKind==='conc'?1:0.9);
  g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=1.2;
  const rows=[BASE,452,478,510,H];
  for(let r=0;r<4;r++){
    g.beginPath();g.moveTo(x0,rows[r]+0.5);g.lineTo(x1,rows[r]+0.5);g.stroke();
    if(floorKind!=='conc'){
      const sp=210+r*40,off=(r*97)%sp;
      for(let xx=Math.floor((x0-off)/sp)*sp+off;xx<x1;xx+=sp){g.beginPath();g.moveTo(xx,rows[r]);g.lineTo(xx,rows[r+1]);g.stroke();}
    }
  }
}
function beam(g,x,top,w,len,skew,a){
  g.fillStyle=lin(g,0,top,0,top+len,[[0,'rgba(150,175,230,'+a+')'],[1,'rgba(150,175,230,0)']]);
  g.beginPath();g.moveTo(x,top);g.lineTo(x+w,top);g.lineTo(x+w+skew+w*0.3,top+len);g.lineTo(x+skew-w*0.3,top+len);g.closePath();g.fill();
}
function windowFrame(g,x,y,w,h,t,snow){
  g.fillStyle='#1c1612';g.fillRect(x-8,y-8,w+16,h+16);
  g.fillStyle=lin(g,0,y,0,y+h,[[0,'#243558'],[1,'#47598a']]);g.fillRect(x,y,w,h);
  if(snow){g.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<26;i++){const sx=x+((i*53+t*18+Math.sin(t+i)*8)%w+w)%w,sy=y+((i*37+t*40)%h);g.fillRect(sx,sy,2,2);}}
  g.fillStyle='#17110d';g.fillRect(x+w/2-3,y,6,h);g.fillRect(x,y+h*0.45,w,6);
  g.fillStyle='#2a211a';g.fillRect(x-14,y+h+8,w+28,8);
  g.fillStyle='rgba(255,255,255,.1)';g.fillRect(x,y,w*0.35,h);
}
function doorArt(g,x,w,h,col,lab,opt){
  opt=opt||{};const y=BASE+8-h,l=x-w/2;
  g.fillStyle='#0f0b08';g.fillRect(l-10,y-10,w+20,h+10);
  g.fillStyle=lin(g,l,0,l+w,0,[[0,col[0]],[0.5,col[1]],[1,col[0]]]);g.fillRect(l,y,w,h);

function drawScare(g,w,h,u,kind){
  g.save();
  g.fillStyle='#000';g.fillRect(0,0,w,h);
  const zoom=0.75+Math.min(1,u*3)*0.55+u*0.12,cx=w/2+Math.sin(u*80)*10,cy=h*0.52+Math.cos(u*70)*8;
  const R=rng(Math.floor(u*30)+3);
  const fh=h*0.9*zoom,fw=fh*0.66;
  g.translate(cx,cy);
  // موهای آویزان
  g.strokeStyle='#050505';g.lineWidth=3;
  for(let k=0;k<44;k++){const a=-fw*0.55+k*(fw*1.1/44);g.beginPath();g.moveTo(a,-fh*0.5);g.quadraticCurveTo(a+(R()-0.5)*40,0,a+(R()-0.5)*90,fh*0.55+R()*60);g.stroke();}
  // صورت
  g.fillStyle=rad(g,0,-fh*0.08,fh*0.05,fh*0.6,[[0,'#f0f0e4'],[0.6,'#a7a99a'],[1,'#40423c']]);
  g.beginPath();g.ellipse(0,0,fw*0.5,fh*0.5,0,0,6.2832);g.fill();
  // ترک‌ها
  g.strokeStyle='rgba(20,20,20,.55)';g.lineWidth=2;
  for(let k=0;k<9;k++){let x=(R()-0.5)*fw*0.7,y=-fh*0.4;g.beginPath();g.moveTo(x,y);for(let s=0;s<6;s++){x+=(R()-0.5)*40;y+=fh*0.12;g.lineTo(x,y);}g.stroke();}
  // چشم‌ها
  for(let s=-1;s<=1;s+=2){
    g.fillStyle='#000';g.beginPath();g.ellipse(s*fw*0.19,-fh*0.1,fw*0.1,fh*0.095,s*0.15,0,6.2832);g.fill();
    g.fillStyle=kind==='catch'?'#c40d12':'#ddd';g.beginPath();g.arc(s*fw*0.19+(R()-0.5)*4,-fh*0.09,fw*0.014,0,6.2832);g.fill();
  }
  // دهان
  g.fillStyle='#000';const mo=fh*(0.14+0.07*Math.abs(Math.sin(u*40)));
  g.beginPath();g.ellipse(0,fh*0.22,fw*0.2,mo,0,0,6.2832);g.fill();
  g.fillStyle='#bdbdae';for(let k=-4;k<=4;k++){g.beginPath();g.moveTo(k*fw*0.035-5,fh*0.22-mo*0.9);g.lineTo(k*fw*0.035,fh*0.22-mo*0.9+fh*0.04+R()*10);g.lineTo(k*fw*0.035+5,fh*0.22-mo*0.9);g.fill();}
  g.restore();
  if(kind==='catch'){g.fillStyle='rgba(180,0,0,'+(0.25+0.2*Math.sin(u*60))+')';g.fillRect(0,0,w,h);}
  // نویز
  g.fillStyle='rgba(255,255,255,.07)';for(let k=0;k<90;k++)g.fillRect(Math.random()*w,Math.random()*h,w*0.2,1+Math.random()*2);
}

function ridge(g,par,baseY,amp,fr,seed,col){
  const u0=cam.x*par-40,u1=u0+VW+80;

  for(let u=u0;u<=u1;u+=14){const hh=amp*(0.5*Math.sin(u*fr+seed)+0.3*Math.sin(u*fr*2.3+seed*2)+0.2*Math.sin(u*fr*5.1+seed*3));g.lineTo(u,baseY-hh);}
  g.lineTo(u1,baseY+260);g.closePath();g.fill();g.restore();
}
function pines(g,par,baseY,seed,col,size){
  const u0=cam.x*par-90,u1=u0+VW+180,sp=44;
  g.save();g.translate(cam.x*(1-par),0);g.fillStyle=col;
  for(let i=Math.floor(u0/sp);i<=Math.ceil(u1/sp);i++){
    const R=rng(i*31+seed);if(R()<0.22)continue;
    const x=i*sp+R()*28,hh=size*(0.6+R()*0.7),w=hh*0.36;
    for(let k=0;k<3;k++){const yy=baseY-hh*(0.2+k*0.27),ww=w*(1-k*0.24);g.beginPath();g.moveTo(x,yy-hh*0.4);g.lineTo(x+ww,yy);g.lineTo(x-ww,yy);g.closePath();g.fill();}
    g.fillRect(x-3,baseY-hh*0.2,6,hh*0.2+4);
  }
  g.restore();
}

function chairArt(g,x,dir){

  ell(g,0,BASE+22,30,5,'rgba(0,0,0,.3)');
  g.fillStyle='#2d2319';g.fillRect(-16,BASE-12,34,6);g.fillRect(-14,BASE-6,4,26);g.fillRect(12,BASE-6,4,26);
  g.fillRect(-16,BASE-62,5,56);g.fillRect(-16,BASE-62,5,4);g.fillStyle='#3b2e20';g.fillRect(-16,BASE-58,5,30);
  g.restore();
}
function lampArt(g,x,y,len,on){
  g.strokeStyle='#111';g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+len);g.stroke();
  g.fillStyle='#2a2a2a';g.beginPath();g.moveTo(x-16,y+len+14);g.lineTo(x-6,y+len);g.lineTo(x+6,y+len);g.lineTo(x+16,y+len+14);g.closePath();g.fill();
  if(on)ell(g,x,y+len+14,10,3,'#f3d58a');
}
function tallyArt(g,x,y,n,prog){
  g.strokeStyle='rgba(235,235,225,.82)';g.lineWidth=2.4;g.lineCap='round';
  const R=rng(Math.floor(x));
  for(let k=0;k<n;k++){
    const gx=x-22+(k%2)*28,gy=y+Math.floor(k/2)*32;
    if(prog!==undefined&&k>=prog)break;
    g.beginPath();g.moveTo(gx+(R()-0.5)*2,gy);g.lineTo(gx+(R()-0.5)*3,gy+24);g.stroke();
  }
}
function tallyRow(g,x,y,n){
  g.strokeStyle='rgba(230,230,215,.82)';g.lineWidth=2.2;g.lineCap='round';
  for(let k=0;k<n;k++){const gr=Math.floor(k/5),i=k%5,bx=x+gr*70+i*11;
    if(i<4){g.beginPath();g.moveTo(bx,y);g.lineTo(bx+1,y+28);g.stroke();}
    else{g.beginPath();g.moveTo(bx-46,y+24);g.lineTo(bx-4,y+4);g.stroke();}}
}
function paintLight(g,L,col,gscale){
  const a=L.a*gscale;
  if(L.t==='r'){g.fillStyle=rad(g,L.x,L.y,0,L.r,[[0,'rgba('+col+','+a+')'],[0.5,'rgba('+col+','+a*0.45+')'],[1,'rgba('+col+',0)']]);g.fillRect(L.x-L.r,L.y-L.r,L.r*2,L.r*2);}
  else if(L.t==='rect'){g.fillStyle='rgba('+col+','+a+')';g.fillRect(L.x,L.y,L.w,L.h);}
  else if(L.t==='beam'){
    g.fillStyle=lin(g,0,L.top,0,L.top+L.len,[[0,'rgba('+col+','+a+')'],[1,'rgba('+col+',0)']]);
    g.beginPath();g.moveTo(L.x,L.top);g.lineTo(L.x+L.w,L.top);g.lineTo(L.x+L.w+L.skew+L.w*0.3,L.top+L.len);g.lineTo(L.x+L.skew-L.w*0.3,L.top+L.len);g.closePath();g.fill();
  }
}
function beamL(x,top,w,len,skew,a){return{t:'beam',x,top,w,len,skew,a,c:'120,150,220'};}
function winL(x,y,w,h,a){return{t:'rect',x,y,w,h,a,c:'110,140,210'};}

   منطق بازی: بازیکن، معماها، هیولا، ترس‌ها، پایان
   ===================================================== */
const In={left:false,right:false,run:false};
const Mon={on:false,scene:'',x:0,mode:'stalk',speed:60,watched:false,stare:0,pend:null};
let CP={scene:'courtyard',x:300,mon:null};
let stepAcc=0,nextFlick=14,baseT=6,near=null;

function busy(){return G.lock||G.modal||G.paused||FX.fadeDir!==0||!!FX.scare||G.state!=='play';}

/* ---------- عبور بین صحنه‌ها ---------- */
function goto(id,x,done){
  if(FX.fadeDir!==0)return;
  FX.fadeDir=1;FX.fadeCb=()=>{
    const chasing=!!G.flags.chase;
    G.scene=id;P.x=x;P.target=null;P.unlock=null;P.vx=0;
    const sc=SC[id];cam.x=clamp(P.x-VW*0.42,0,Math.max(0,sc.w-VW));
    if(chasing){
      if(id==='basement'){endChase();}
      else{Mon.on=false;Mon.pend={scene:id,x:x,delay:2.8};}
    }
    Snd.setKind(sc.kind);
    if(sc.enter)sc.enter();
    save();
    if(done)done();
  };
}
function doorAct(o){
  const msg=o.locked?o.locked():null;
  if(msg){Snd.buzz();say(msg);return;}
  if(!o.to)return;
  if(o.timed){if(!P.unlock){P.unlock={t:0,dur:o.timed,o};Snd.creak(0.8);vib(30);}return;}
  Snd.door();goto(o.to,o.spawn);
}
function interact(o){
  if(busy())return;
  if(o.vis&&!o.vis())return;
  if(o.to!==undefined){doorAct(o);return;}
  Snd.click();if(o.act)o.act(o);
}
function objsNow(){return SC[G.scene].objs.filter(o=>!o.vis||o.vis());}

/* ---------- ورودی ---------- */
function worldTap(sx,sy){
  if(busy())return;
  let best=null,bd=1e9;
  for(const o of objsNow()){
    const hw=o.w/2+26;
    if(Math.abs(sx-o.x)<=hw&&sy>=o.top-26&&sy<=o.bot+12){const d=Math.abs(sx-o.x);if(d<bd){bd=d;best=o;}}
  }
  if(best){P.target={x:best.x,o:best,reach:best.reach||54};}
  else if(sy>BASE-70){P.target={x:sx,o:null,reach:14};}
}

/* ---------- بازیکن ---------- */
function updatePlayer(dt){
  const sc=SC[G.scene];let want=0;
  if(!busy()){
    if(In.left)want-=1;if(In.right)want+=1;
    if(want!==0){P.target=null;}
    else if(P.target){
      const dx=P.target.x-P.x;
      if(Math.abs(dx)>P.target.reach)want=Math.sign(dx);
      else{const o=P.target.o;P.target=null;if(o)interact(o);}
    }
  }
  if(P.unlock)want=0;
  const chase=!!G.flags.chase;
  const run=In.run||chase||(P.target&&Math.abs(P.target.x-P.x)>520);
  const sp=want===0?0:(run?285:165);
  P.vx=lerp(P.vx,want*sp,clamp(dt*10,0,1));
  if(Math.abs(P.vx)>4)P.x+=P.vx*dt;
  if(want!==0)P.dir=want;
  P.x=clamp(P.x,sc.min,sc.w-80);
  P.walk+=Math.abs(P.vx)*dt*0.048;
  stepAcc+=Math.abs(P.vx)*dt;
  if(stepAcc>(run?96:68)){
    stepAcc=0;Snd.step(sc.surf,run);
    if(G.scene==='courtyard'){AN.prints.push({x:P.x,y:FEET+10+((P.step++%2)?7:-3),t:G.time});if(AN.prints.length>110)AN.prints.shift();}
  }
  // باز کردن قفل زمان‌دار
  if(P.unlock){
    P.unlock.t+=dt;
    if(P.unlock.t>=P.unlock.dur){const o=P.unlock.o;P.unlock=null;Snd.unlock();Snd.door();goto(o.to,o.spawn);}
  }
  // درهای خودکار هنگام فرار
  if(chase&&!busy()&&!P.unlock){
    for(const o of sc.objs){
      if(o.to===undefined)continue;
      if(o.auto&&P.x<o.x+66){doorAct(o);break;}
      if(o.timed&&Math.abs(P.x-o.x)<60&&(!o.locked||!o.locked())){doorAct(o);break;}
    }
  }
}

  FX.shake=1;FX.flash=1;FX.glitch=0.09;vib([0,90,40,220]);
}

/* ---------- هیولا ---------- */
function startStalk(){
  Mon.on=true;Mon.scene='dorm';Mon.x=3040;Mon.mode='stalk';Mon.speed=64;Mon.stare=0;Mon.pend=null;
  CP={scene:'dorm',x:200,mon:'stalk'};
  Snd.creak(1.5);Snd.whisper(5,0.5);
  say('صدای فنرِ تختی… از انتهای اتاق. انگار کسی بلند شد.',4);
}
function startChase(){
  Mon.on=true;Mon.scene='dorm';Mon.mode='chase';Mon.speed=235;Mon.pend=null;
  Mon.x=Math.min(P.x+560,SC.dorm.w-80);
  CP={scene:'dorm',x:P.x,mon:'chase'};G.flags.chase=1;
  FX.flick=2;say('بدو!',2);vib([0,120,60,120]);
}
function endChase(){
  Mon.on=false;Mon.pend=null;G.flags.chase=0;FX.tension=0;Snd.setTension(0);
}
function updateMon(dt){
  if(Mon.pend){
    Mon.pend.delay-=dt;
    if(Mon.pend.delay<=0){Mon.scene=Mon.pend.scene;Mon.x=Mon.pend.x;Mon.on=true;Mon.pend=null;Snd.slam();vib(80);}
  }
  if(!Mon.on||Mon.scene!==G.scene){FX.tension=Math.max(0,FX.tension-dt);Snd.setTension(FX.tension);return;}
  if(busy()&&!FX.scare){/* در حین گفتگو/نوشته‌ها هم‌چنان حرکت می‌کند */}
  if(G.dead)return;
  const dist=Mon.x-P.x,ad=Math.abs(dist),to=dist>=0?1:-1;
  if(Mon.mode==='stalk'){
    const lit=(P.dir===to)&&ad<560&&FX.off<=0;
    Mon.watched=lit;
    if(!lit){Mon.x-=to*Mon.speed*dt;Mon.stare=Math.max(0,Mon.stare-dt);}
    else if(ad<430){
      Mon.stare+=dt;
      if(Mon.stare>3.4){Mon.stare=0;Mon.x-=to*135;Snd.stinger(0.45);FX.flick=0.9;vib([0,70]);}
    }
  }else{Mon.x-=to*Mon.speed*dt;}
  if(ad<300&&Math.random()<dt*2.2)FX.flick=Math.max(FX.flick,0.15);
  const tn=clamp(1-ad/950,0,1)*(Mon.mode==='chase'?1:0.85);
  FX.tension=lerp(FX.tension,tn,clamp(dt*4,0,1));Snd.setTension(FX.tension);
  if(ad<54&&!FX.scare)caught();
}
function caught(){
  if(G.dead)return;G.dead=true;P.unlock=null;
  scare('catch',1.1);
  later(1.6,()=>{
    FX.fadeDir=1;FX.fade=0.6;
    FX.fadeCb=()=>{
      G.dead=false;G.flags.chase=0;Mon.on=false;Mon.pend=null;Snd.setTension(0);FX.tension=0;
      G.scene=CP.scene;P.x=CP.x;P.target=null;P.vx=0;P.dir=CP.mon==='chase'?-1:1;
      const sc=SC[G.scene];cam.x=clamp(P.x-VW*0.42,0,Math.max(0,sc.w-VW));
      Snd.setKind(sc.kind);
      if(CP.mon==='chase'){later(0.9,()=>startChase());say('این بار سریع‌تر…',2);}
      else{G.flags.stalk=0;}
    };
  });
}

/* ---------- شمارش میزها ---------- */
function countOf(prefix){return Object.keys(G.counts).filter(k=>k[0]===prefix).length;}
function countDesk(i){
  if(G.flags.deskDone){say('دوازده تا بودند. سیزدهمی هم هست… ولی من نشمردمش.');return;}
  if(G.counts['d'+i]){say('این را شمرده بودم.',1.6);return;}
  G.counts['d'+i]=1;const n=countOf('d');
  Snd.tick(n);vib(20);
  say(fa(n)+'… روی میز کنده شده: «'+NAMES[i]+'»',2.4);
  if(n===12){G.lock=true;later(2.3,desk13Event);}
}
function desk13Event(){
  Snd.duck(1.8);blackout(1.8);
  later(1.8,()=>{
    Snd.unduck();Snd.creak(1.6);Snd.knock(1);
    later(0.9,()=>{
      G.flags.desk13=1;G.flags.deskDone=1;AN.desk=0;
      Snd.stinger(0.55);vib([0,80,50,120]);FX.flick=1.2;FX.shake=0.5;
      say('…سیزده.',3);addNote('desks');addNote('tally');
      later(1.8,()=>{G.lock=false;});
    });
  });
}

/* ---------- خوابگاه ---------- */
function bedAct(i,txt){
  if(i===6){
    if(G.items.key_base){say('تخت نیما. خالی.');return;}
    G.lock=true;
    say('زیر بالشِ نیما… یک کلید.',2.4);
    later(2.4,()=>{giveItem('key_base');addNote('nima');Snd.duck(1.3);blackout(1.3);});
    later(3.7,()=>{Snd.unduck();Snd.scream(0.7);Snd.slam();vib([0,100,60,100]);G.lock=false;startChase();});
    return;
  }
  say(txt,4.2);
}

/* ---------- زیرزمین ---------- */
function countTally(i){
  if(G.flags.tallyDone||G.flags.tally13){return;}
  if(G.counts['t'+i]){say('این ستون را شمرده بودم.',1.6);return;}
  G.counts['t'+i]=1;const n=countOf('t');
  Snd.tick(n);vib(20);say(fa(n)+'…',1.4);
  if(n===12){G.lock=true;later(1.6,()=>{
    Snd.duck(1.5);blackout(1.5);
    later(1.5,()=>{
      Snd.unduck();G.flags.tally13=1;AN.tally=0;Snd.thump(1);
      for(let k=0;k<6;k++)later(k*0.38,()=>Snd.paper());
      say('…و کسی همان‌جا، با گچ، ستون سیزدهم را نوشت.',4);
      later(3.4,()=>{G.flags.tallyDone=1;addNote('tallies');addNote('base');G.lock=false;say('۱۳. شماره‌ی کل: سیزده.',3.5);});
    });
  });}
}
function openFinalDoor(){
  if(G.flags.doorOpen){Snd.door();goto('final',140);return;}
  openKeypad('قفل درِ ۱۳','13',()=>{
    G.flags.doorOpen=1;Snd.unlock();later(0.6,()=>{Snd.door();goto('final',140);});

}

/* ---------- پایان اپیزود ---------- */
function finalSeq(){
  if(G.flags.final)return;G.flags.final=1;G.lock=true;P.target=null;
  say('روی صندلی نشستم. دوازده صندلی دیگر، همه به من نگاه می‌کنند.',3.4);
  later(3.6,()=>{Snd.duck(2.4);blackout(2.4);});
  later(6,()=>{Snd.unduck();});
  for(let k=1;k<=12;k++){
    later(6.2+k*1.05,()=>{say(fa(k)+'…',1.0);Snd.whisper(3,k%2?-0.8:0.8);Snd.tick(k);vib(18);if(k>8)FX.flick=0.3;});
  }
  later(6.2+12*1.05+1.1,()=>{Snd.duck(2.6);blackout(2.6);});
  later(6.2+12*1.05+3.5,()=>{Snd.unduck();Snd.whisper(2,0);say('…',1);});
  later(6.2+12*1.05+4.8,()=>{scare('final',1.5);say('سیزده.',1.5);});
  later(6.2+12*1.05+6.8,()=>{blackout(30);endScreens();});

function endScreens(){
  G.state='end';wipeSave();
  const el=$('end'),box=$('endText');el.className='panel on';box.innerHTML='';
  const dv=G.model||deviceInfo().name,now=new Date();
  const hh=fa(String(now.getHours()).padStart(2,'0')),mm=fa(String(now.getMinutes()).padStart(2,'0'));
  const lines=[
    ['err','خطا: فایل بازی آسیب دیده است.'],
    ['',''],
    ['reg','دفتر حضور و غیاب — شب ۱۳ بهمن'],
    ['reg','حاضر: ۱۲'],
    ['reg','شمرده‌شده: ۱۳'],
    ['reg red','نفر سیزدهم: '+(dv||'کسی که همین الان این صفحه را در دست دارد')],
    ['reg','ساعت ثبت: '+hh+':'+mm+(G.battery!=null?'   —   باتری: '+fa(G.battery)+'٪':'')],
    ['',''],
    ['big','ادامه دارد…'],
    ['sub2','اپیزود ۲: دوازده نفر']

}

/* ---------- کیپد و دفتر ---------- */
let kpVal='',kpCode='',kpOk=null,kpFails=0;
function openKeypad(title,code,onOk,sub){
  kpVal='';kpCode=code;kpOk=onOk;kpFails=0;G.modal=true;
  $('kpTitle').textContent=title;$('kpSub').textContent=sub||'';
  kpDraw();$('keypad').className='panel on';
}
function kpDraw(){let s='';for(let i=0;i<kpCode.length;i++)s+=(i<kpVal.length?fa(kpVal[i]):'•')+' ';$('kpDisp').textContent=s.trim();}
function kpPress(k){
  if(k==='c'){kpVal='';}
  else if(k==='ok'){kpSubmit();return;}
  else if(kpVal.length<kpCode.length){kpVal+=k;Snd.beep();}
  kpDraw();
  if(kpVal.length===kpCode.length&&k!=='c')setTimeout(kpSubmit,180);
}
function kpSubmit(){
  if(!$('keypad').classList.contains('on'))return;
  if(kpVal===kpCode){closeKeypad();Snd.unlock();const f=kpOk;kpOk=null;if(f)f();}
  else{
    Snd.buzz();vib([0,60,40,60]);kpVal='';kpDraw();kpFails++;
    const d=$('kpDisp');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    if(kpFails>=3)$('kpSub').textContent='راهنما: '+(kpCode.length===4?'تاریخِ روی تخته یا تقویم را ببین.':'عددی که نباید می‌شمردی.');
  }
}
function closeKeypad(){$('keypad').className='panel';G.modal=false;}
function openNotes(){
  if(G.state!=='play'||G.lock||FX.scare)return;
  G.modal=true;
  const items=Object.keys(G.items).map(k=>'<div class="it"><b>'+ITEMS[k].n+'</b><span>'+ITEMS[k].d+'</span></div>').join('')||'<div class="em">هنوز چیزی برنداشته‌ای.</div>';
  const notes=G.notes.map(k=>'<div class="nt">'+NOTES[k]+'</div>').join('')||'<div class="em">هنوز یادداشتی نداری. به همه‌چیز دست بزن.</div>';
  $('noteBody').innerHTML='<h3>وسایل</h3>'+items+'<h3>یادداشت‌ها</h3>'+notes+'<div id="hintBox"></div>';
  $('note').className='panel on';
}
function closeNotes(){$('note').className='panel';G.modal=false;}

/* ---------- بوم و نور ---------- */
const cv=$('cv'),ctx=cv.getContext('2d',{alpha:false,desynchronized:true});
const LC=document.createElement('canvas'),lg=LC.getContext('2d',{alpha:true,desynchronized:true});
let vigC=null,snowP=[],dust=[];
function buildVig(){
  vigC=mkc(128,72);const g=vigC.getContext('2d');
  g.fillStyle=rad(g,64,36,8,84,[[0,'rgba(0,0,0,0)'],[0.6,'rgba(0,0,0,.35)'],[1,'rgba(0,0,0,.92)']]);g.fillRect(0,0,128,72);
}
function resize(){
  const w=window.innerWidth||960,h=window.innerHeight||540,dpr=window.devicePixelRatio||1;
  const q=G.settings.quality==='low'?0.72:G.settings.quality==='medium'?1:1.5;
  const k=Math.min(dpr,q,1400/h);
  cv.width=Math.max(320,Math.round(w*k));cv.height=Math.max(180,Math.round(h*k));
  S=cv.height/H;VW=cv.width/S;
  const lightScale=G.settings.quality==='low'?4:G.settings.quality==='medium'?3:2.5;LC.width=Math.ceil(cv.width/lightScale);LC.height=Math.ceil(cv.height/lightScale);
  buildVig();
}
function flashGeo(){
  const ang=(P.dir>0?0.05:Math.PI-0.05)+Math.sin(G.time*1.3)*0.015;
  return{ox:P.x+P.dir*30,oy:FEET-110,ang,len:G.scene==='courtyard'?700:620,half:0.3};
}
function coneHole(g,f,pw){
  for(const m of [1,0.78,0.58,0.4,0.24]){
    g.fillStyle=rad(g,f.ox,f.oy,6,f.len,[[0,'rgba(255,255,255,'+0.55*pw+')'],[0.5,'rgba(255,255,255,'+0.3*pw+')'],[1,'rgba(255,255,255,0)']]);
    g.beginPath();g.moveTo(f.ox,f.oy);g.arc(f.ox,f.oy,f.len,f.ang-f.half*m,f.ang+f.half*m);g.closePath();g.fill();
  }
}
function flashI(){
  if(FX.off>0)return 0;
  let v=0.97+0.03*Math.sin(G.time*23);
  if(FX.flick>0)v=Math.random()<0.5?rnd(0.05,0.5):rnd(0.6,1);
  return v;
}
function renderLight(sc,t,fi){
  const k=S/(G.settings.quality==='low'?4:G.settings.quality==='medium'?3:2.5);
  lg.setTransform(1,0,0,1,0,0);lg.globalCompositeOperation='source-over';lg.clearRect(0,0,LC.width,LC.height);
  lg.fillStyle='rgba(0,0,0,'+sc.dark+')';lg.fillRect(0,0,LC.width,LC.height);
  lg.setTransform(k,0,0,k,-cam.x*k,0);lg.globalCompositeOperation='destination-out';
  const L=sc.lights?sc.lights(t):[];
  for(const l of L)paintLight(lg,l,'255,255,255',1);
  if(fi>0)coneHole(lg,flashGeo(),fi);
  lg.fillStyle=rad(lg,P.x,FEET-80,0,160,[[0,'rgba(255,255,255,.62)'],[1,'rgba(255,255,255,0)']]);lg.fillRect(P.x-170,FEET-250,340,330);
  lg.globalCompositeOperation='source-over';
}

/* ---------- ذرات ---------- */
function initParticles(){
  const low=G.settings.quality==='low';snowP=[];for(let i=0;i<(low?55:140);i++)snowP.push({x:Math.random(),y:Math.random(),z:0.3+Math.random()*0.7});
  dust=[];for(let i=0;i<(low?22:60);i++)dust.push({x:Math.random(),y:0.15+Math.random()*0.7,vx:rnd(-6,6),vy:rnd(-4,4),a:0.2+Math.random()*0.4});
}
function updParticles(dt){
  const out=SC[G.scene].kind==='out';
  if(out)for(const s of snowP){s.y+=dt*0.06*s.z*H/H*1.6;s.x-=dt*0.01*s.z;if(s.y>1){s.y=-0.02;s.x=Math.random();}if(s.x<0)s.x=1;}
  else for(const d of dust){d.x+=d.vx*dt/VW;d.y+=d.vy*dt/H;if(d.x<0)d.x=1;if(d.x>1)d.x=0;if(d.y<0.1)d.y=0.85;if(d.y>0.9)d.y=0.15;}
}

/* ---------- رندر ---------- */
function render(){
  const g=ctx,sc=SC[G.scene],t=G.time,fi=flashI();
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  const sh=FX.shake*9,sx=(Math.random()-0.5)*sh*S,sy=(Math.random()-0.5)*sh*S;
  g.setTransform(S,0,0,S,-cam.x*S+sx,sy);
  const x0=cam.x-30,x1=cam.x+VW+30;
  g.textAlign='center';
  sc.bg(g,x0,x1,t);
  g.textAlign='center';
  if(G.scene==='dorm'&&!G.flags.stalk&&!G.items.key_base)drawFigure(g,3040,t,'back',-1);
  if(Mon.on&&Mon.scene===G.scene){
    const f=Mon.x>P.x?-1:1;
    drawFigure(g,Mon.x,t,Mon.mode==='chase'?'run':(Mon.watched?'stalk':'stalk'),f);
  }
  if(FX.echo){const e=FX.echo;g.save();g.globalAlpha=clamp(1-e.t/e.dur,0,1)*.42;g.filter='blur(1.1px)';drawFigure(g,e.x,t,'stalk',e.dir);g.filter='none';g.restore();}
  drawPlayer(g,t);
  // مه و گرد و غبار و برف
  const out=sc.kind==='out';
  for(let i=0;i<6;i++){
    const fx=((i*610+t*(9+i*3))%(sc.w+800))-400;if(fx<x0-280||fx>x1+280)continue;
    const fy=(out?BASE+10:BASE-40)+Math.sin(t*0.2+i)*30;
    g.fillStyle=rad(g,fx,fy,0,270,[[0,'rgba(190,205,225,'+(out?0.1:0.075)+')'],[1,'rgba(190,205,225,0)']]);g.fillRect(fx-270,fy-270,540,540);
  }
  if(out){g.fillStyle='#fff';for(const s of snowP){g.globalAlpha=0.35+0.5*s.z;g.fillRect(cam.x+s.x*VW,s.y*H,1+s.z*1.8,1+s.z*1.8);}g.globalAlpha=1;}
  else{g.fillStyle='#e8eef8';for(const d of dust){g.globalAlpha=d.a;g.beginPath();g.arc(cam.x+d.x*VW,d.y*H,1.3,0,6.2832);g.fill();}g.globalAlpha=1;}
  // تاریکی و نور
  renderLight(sc,t,fi);
  g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=true;
  g.drawImage(LC,sx,sy,cv.width,cv.height);
  g.setTransform(S,0,0,S,-cam.x*S+sx,sy);
  g.save();g.globalCompositeOperation='lighter';
  if(fi>0){const f=flashGeo();for(const m of [1,0.7,0.45]){g.fillStyle=rad(g,f.ox,f.oy,6,f.len,[[0,'rgba(255,228,165,'+0.085*fi+')'],[1,'rgba(255,228,165,0)']]);g.beginPath();g.moveTo(f.ox,f.oy);g.arc(f.ox,f.oy,f.len,f.ang-f.half*m,f.ang+f.half*m);g.closePath();g.fill();}}
  if(sc.lights)for(const l of sc.lights(t))if(l.c)paintLight(g,l,l.c,0.2);
  g.restore();
  // نشانگر اشیا
  if(G.state==='play'&&!G.modal&&G.settings.marks){
    for(const o of objsNow()){
      const d=Math.abs(o.x-P.x);if(d>320)continue;
      if(/^(desk|t)\d+$/.test(o.id)&&G.counts[o.id.charAt(0)==='d'?'d'+o.id.slice(4):'t'+o.id.slice(1)])continue;
      if(o.id==='desk13'&&G.items.key_office)continue;
      const a=(0.55-d/700)*(0.6+0.4*Math.sin(t*3+o.x));if(a<=0)continue;
      const yy=Math.max(o.top-16,40)+Math.sin(t*2.4+o.x)*3;
      g.fillStyle='rgba(235,240,255,'+a+')';g.beginPath();g.moveTo(o.x,yy+8);g.lineTo(o.x-5,yy);g.lineTo(o.x,yy-8);g.lineTo(o.x+5,yy);g.closePath();g.fill();
    }
  }
  // سطح شاشه
  g.setTransform(1,0,0,1,0,0);
  g.drawImage(vigC,0,0,cv.width,cv.height);
  if(FX.tension>0.05){g.fillStyle=rad(g,cv.width/2,cv.height/2,cv.height*0.25,cv.width*0.7,[[0,'rgba(120,0,0,0)'],[1,'rgba(150,0,10,'+(0.35*FX.tension)+')']]);g.fillRect(0,0,cv.width,cv.height);}
  if(FX.flick>0&&G.state==='play'){g.fillStyle='rgba(190,205,230,'+(Math.min(.07,FX.flick*.055))+')';g.fillRect(0,0,cv.width,cv.height);}
  if(G.settings.quality!=='low'){g.save();g.globalCompositeOperation='overlay';g.globalAlpha=G.settings.quality==='high'?.14:.09;g.fillStyle=Tex.pGrain[(t*12|0)%3];
  g.translate((t*17)%128,(t*11)%128);g.fillRect(-128,-128,cv.width+256,cv.height+256);g.restore();}
  if(FX.scare){const u=FX.scare.t/FX.scare.dur;drawScare(g,cv.width,cv.height,u,FX.scare.kind);}
  if(FX.flash>0){g.fillStyle='rgba(255,255,255,'+Math.min(1,FX.flash*0.8)+')';g.fillRect(0,0,cv.width,cv.height);}
  const ba=Math.max(FX.fade,FX.blk>0?1:0);
  if(ba>0){g.fillStyle='rgba(0,0,0,'+ba+')';g.fillRect(0,0,cv.width,cv.height);}
  const gl=FX.glitch>0?'invert(1) contrast(1.5)':'';
  if(cv._gl!==gl){cv.style.filter=gl;cv._gl=gl;}
}

/* ---------- به‌روزرسانی ---------- */
let hudCache={};
function setCls(id,c){if(hudCache[id]!==c){hudCache[id]=c;$(id).classList.toggle('on',c==='on');}}
function setTxt(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
function update(dt){
  G.time+=dt;
  tickTimers(dt);updSub(dt);
  FX.shake=Math.max(0,FX.shake-dt*2.2);FX.flash=Math.max(0,FX.flash-dt*4);
  FX.glitch=Math.max(0,FX.glitch-dt);FX.flick=Math.max(0,FX.flick-dt);FX.off=Math.max(0,FX.off-dt);FX.blk=Math.max(0,FX.blk-dt);
  if(FX.scare){FX.scare.t+=dt;if(FX.scare.t>=FX.scare.dur)FX.scare=null;}
  if(FX.fadeDir!==0){
    FX.fade+=FX.fadeDir*dt*3.4;
    if(FX.fadeDir>0&&FX.fade>=1){FX.fade=1;FX.fadeDir=-1;const cb=FX.fadeCb;FX.fadeCb=null;if(cb)cb();}
    else if(FX.fadeDir<0&&FX.fade<=0){FX.fade=0;FX.fadeDir=0;}
  }
  const sc=SC[G.scene];
  if(G.state==='play'){
    autoSaveT+=dt;if(autoSaveT>=12){autoSaveT=0;save();}
    if(FX.echo){FX.echo.t+=dt;if(FX.echo.t>=FX.echo.dur)FX.echo=null;}
    if(!G.flags.chase&&!FX.scare&&!G.modal&&!G.paused){
      ambientScareT-=dt;
      if(ambientScareT<=0){
        ambientScareT=rnd(19,34);
        const roll=Math.random();
        if(roll<.48){FX.echo={x:P.x+P.dir*rnd(260,390),dir:-P.dir,t:0,dur:rnd(.55,.9)};Snd.whisper(3,P.dir*.55);FX.flick=Math.max(FX.flick,.38);}
        else if(roll<.82){Snd.knock(Math.random()<.5?2:3);FX.shake=Math.max(FX.shake,.12);}
        else{Snd.door();FX.flick=Math.max(FX.flick,.72);say('صدای قدمی از اتاق کناری آمد…',2.3);}
      }
    }
    updatePlayer(dt);updateMon(dt);
    if(sc.update)sc.update(dt);
    nextFlick-=dt;if(nextFlick<=0){nextFlick=rnd(14,28);FX.flick=Math.max(FX.flick,0.24);}
    Snd.update(dt);
    let tx=P.x-VW*0.42+P.dir*70;tx=clamp(tx,0,Math.max(0,sc.w-VW));cam.x=lerp(cam.x,tx,clamp(dt*4,0,1));
    updHud();
  }else if(G.state==='title'){
    cam.x=clamp(260+Math.sin(G.time*0.12)*60,0,SC.courtyard.w-VW);
  }
  updParticles(dt);
}
function updHud(){
  near=null;let nd=1e9;
  if(!busy())for(const o of objsNow()){const d=Math.abs(o.x-P.x);if(d<(o.reach||54)+46&&d<nd){nd=d;near=o;}}
  setCls('bAct',near?'on':'');if(near)setTxt('actLbl',near.n);
  let c='';
  if(G.scene==='classroom'&&!G.flags.deskDone&&countOf('d')>0)c='شمارش: '+fa(countOf('d'));
  else if(G.scene==='basement'&&!G.flags.tallyDone&&countOf('t')>0)c='شمارش: '+fa(countOf('t'));
  setTxt('cnt',c);
  setCls('bBack',(Mon.on&&Mon.scene===G.scene&&Mon.mode==='stalk')?'on':'');
  const p=P.unlock?Math.round(P.unlock.t/P.unlock.dur*100):0;
  setCls('prog',P.unlock?'on':'');if(P.unlock)$('progBar').style.width=p+'%';
}

/* ---------- حلقه ---------- */
let lastTs=0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-lastTs)/1000;lastTs=ts;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);
  if(!G.paused&&!G.modal)update(dt);
  render();
}

/* ---------- شروع و ادامه ---------- */
function showTitle(){
  G.state='title';G.scene='courtyard';P.x=430;P.dir=1;cam.x=260;Snd.setKind('out');
  $('title').className='panel on';$('settings').className='panel';$('end').className='panel';$('endBtns').className='';
  $('hud').className='';setCls('btnCont',loadSave()?'on':'');
}
function resetWorld(){
  G.items={};G.flags={};G.notes=[];G.counts={};G.dead=false;G.lock=false;G.modal=false;G.paused=false;
  Mon.on=false;Mon.pend=null;AN.prints.length=0;AN.win=0;AN.bed=0;AN.tally=0;AN.desk=0;
  FX.fade=0;FX.fadeDir=0;FX.blk=0;FX.scare=null;FX.echo=null;FX.tension=0;ambientScareT=22;autoSaveT=0;Timers.length=0;P.vx=0;P.target=null;P.unlock=null;
  CP={scene:'courtyard',x:300,mon:null};
}
function beginPlay(){
  $('title').className='panel';$('settings').className='panel';$('end').className='panel';$('hud').className='on';
  G.state='play';
}
const CARDS=['سازمان میراث فرهنگی از تو خواسته آرشیو یک مدرسه‌ی متروکه را دیجیتال کنی.','مدرسه‌ی شبانه‌روزی گردنه‌ی بهمن.\nسی‌وچند سال پیش، شبِ یک کولاک، دوازده دانش‌آموز آنجا ناپدید شدند.','تنها چیزی که پیدا شد، دفتر حضور و غیاب بود.'];
function newGame(){
  Snd.init();resetWorld();wipeSave();
  G.state='intro';$('title').className='panel';$('hud').className='';
  G.scene='courtyard';P.x=300;P.dir=1;cam.x=0;Snd.setKind('out');
  const card=$('card');let t=0.4;
  CARDS.forEach((txt,i)=>{
    later(t,()=>{card.textContent=txt;card.className='on';});
    later(t+3.7,()=>{card.className='';});
    t+=4.6;
  });
  later(t,()=>{
    beginPlay();FX.fade=1;FX.fadeDir=-1;
    later(1.6,()=>{Snd.thump(1);FX.shake=0.8;vib([0,200]);say('پشت سرم، جاده زیر برف رفت. تا صبح راهی نیست.',4.6);});
    later(6.6,()=>say('باید وارد ساختمان شوم. در، آن سمت حیاط است.',4));
  });
}
function continueGame(){
  const s=loadSave();if(!s){newGame();return;}
  Snd.init();resetWorld();
  G.items=s.items||{};G.flags=s.flags||{};G.notes=s.notes||[];G.counts=s.counts||{};
  G.flags.chase=0;G.flags.stalk=0;
  let sc=s.scene,x=s.x;
  if(!SC[sc]){sc='courtyard';x=300;}
  if(sc==='final'){sc='basement';x=2800;}
  G.scene=sc;P.x=x;P.dir=s.dir===-1?-1:1;
  const S2=SC[sc];cam.x=clamp(P.x-VW*0.42,0,Math.max(0,S2.w-VW));
  Snd.setKind(S2.kind);beginPlay();FX.fade=1;FX.fadeDir=-1;
  say('ادامه… دوباره تاریکی.',2.4);
}
function pause(on){
  if(G.state!=='play')return;
  G.paused=on;$('pause').className=on?'panel on':'panel';
  if(on)Snd.suspend();else Snd.resume();
}

/* ---------- اتصال رابط ---------- */
function holdBtn(id,key){
  const e=$(id);
  const on=ev=>{ev.preventDefault();In[key]=true;e.classList.add('dn');try{e.setPointerCapture(ev.pointerId);}catch(x){}};
  const off=ev=>{ev.preventDefault();In[key]=false;e.classList.remove('dn');};
  e.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>e.addEventListener(n,off));
}
function tapBtn(id,fn){
  const e=$(id);
  e.addEventListener('click',ev=>{ev.preventDefault();fn(ev);});
}
function wireUI(){
  holdBtn('bL','left');holdBtn('bR','right');holdBtn('bRun','run');
  tapBtn('bAct',()=>{if(near)interact(near);});
  tapBtn('bBack',()=>{if(!busy()){P.dir=-P.dir;P.target=null;Snd.click();}});
  tapBtn('bNote',()=>{if(G.modal&&$('note').classList.contains('on'))closeNotes();else if(!G.paused)openNotes();});
  tapBtn('bPause',()=>pause(true));
  tapBtn('btnNoteClose',closeNotes);
  tapBtn('btnHint',()=>{$('hintBox').textContent='راهنما: '+hint();});
  tapBtn('btnKpClose',()=>{closeKeypad();});
  tapBtn('btnStart',()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}newGame();});
  tapBtn('btnCont',()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}continueGame();});
  tapBtn('btnResume',()=>pause(false));
  tapBtn('btnRestart',()=>{pause(false);newGame();});
  tapBtn('btnFull',async()=>{try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.exitFullscreen)await document.exitFullscreen();if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){toast('تمام‌صفحه در این مرورگر پشتیبانی نمی‌شود.');}});
  const openSettings=()=>{$('settings').className='panel on';$('pause').className='panel';};
  tapBtn('btnSettingsTitle',openSettings);tapBtn('btnSettingsPause',openSettings);
  tapBtn('btnSettingsBack',()=>{$('settings').className='panel';if(G.state==='play'&&G.paused)$('pause').className='panel on';});
  $('volume').value=G.settings.volume;
  setTxt('btnSound',G.settings.mute?'صدا: خاموش':'صدا: روشن');
  setTxt('btnVib',G.settings.vibrate?'لرزش: روشن':'لرزش: خاموش');
  setTxt('btnMarks',G.settings.marks?'نشانگر اشیا: روشن':'نشانگر اشیا: خاموش');
  setTxt('btnVibSettings',G.settings.vibrate?'روشن':'خاموش');
  setTxt('btnMarksSettings',G.settings.marks?'روشن':'خاموش');
  $('volume').addEventListener('input',e=>{Snd.setVolume(e.target.value);saveSettings();});
  const setQuality=q=>{G.settings.quality=q;saveSettings();resize();initParticles();['qLow','qMed','qHigh'].forEach(id=>$(id).style.borderColor='rgba(217,212,195,.45)');$('q'+({low:'Low',medium:'Med',high:'High'}[q])).style.borderColor='#c9a45b';};
  tapBtn('qLow',()=>setQuality('low'));tapBtn('qMed',()=>setQuality('medium'));tapBtn('qHigh',()=>setQuality('high'));setQuality(G.settings.quality);
  tapBtn('btnVibSettings',()=>{G.settings.vibrate=!G.settings.vibrate;saveSettings();setTxt('btnVibSettings',G.settings.vibrate?'روشن':'خاموش');});
  tapBtn('btnMarksSettings',()=>{G.settings.marks=!G.settings.marks;saveSettings();setTxt('btnMarksSettings',G.settings.marks?'روشن':'خاموش');});
  tapBtn('btnMenu',()=>{pause(false);resetWorld();Timers.length=0;showTitle();});
  tapBtn('btnSound',()=>{const m=!G.settings.mute;G.settings.mute=m;saveSettings();Snd.setMuted(m);setTxt('btnSound',m?'صدا: خاموش':'صدا: روشن');});
  tapBtn('btnVib',()=>{G.settings.vibrate=!G.settings.vibrate;saveSettings();setTxt('btnVib',G.settings.vibrate?'لرزش: روشن':'لرزش: خاموش');});
  tapBtn('btnMarks',()=>{G.settings.marks=!G.settings.marks;saveSettings();setTxt('btnMarks',G.settings.marks?'نشانگر اشیا: روشن':'نشانگر اشیا: خاموش');});
  tapBtn('btnAgain',()=>{Timers.length=0;resetWorld();Snd.radioOn(0);showTitle();});
  const grid=$('kpGrid');
  ['1','2','3','4','5','6','7','8','9','c','0','ok'].forEach(k=>{
    const b=document.createElement('button');b.className='kk';b.textContent=k==='c'?'پاک':k==='ok'?'تأیید':fa(k);
    b.addEventListener('click',ev=>{ev.preventDefault();kpPress(k);});grid.appendChild(b);
  });
  const activeTouches=new Map(),sidePointers={left:new Set(),right:new Set()};
  let lastSideTap={side:'',time:0},sprintSide='';
  cv.addEventListener('pointerdown',ev=>{
    if(G.state!=='play'||G.paused||G.modal)return;
    ev.preventDefault();
    const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width;
    if(x<0.44||x>0.56){
      const side=x<0.44?'left':'right',now=performance.now();
      if(lastSideTap.side===side&&now-lastSideTap.time<=340){In.run=true;sprintSide=side;}
      lastSideTap={side,time:now};
      sidePointers[side].add(ev.pointerId);In[side]=true;
      activeTouches.set(ev.pointerId,{side,start:now});
      try{cv.setPointerCapture(ev.pointerId);}catch(e){}
    }else{
      worldTap((ev.clientX-r.left)/r.width*VW+cam.x,(ev.clientY-r.top)/r.height*H);
    }
  });
  const releaseTouch=ev=>{
    const touch=activeTouches.get(ev.pointerId);if(!touch)return;
    activeTouches.delete(ev.pointerId);sidePointers[touch.side].delete(ev.pointerId);
    In[touch.side]=sidePointers[touch.side].size>0;
    if(In.run&&sprintSide===touch.side&&sidePointers[sprintSide].size===0){In.run=false;sprintSide='';}
  };
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,releaseTouch));
  document.addEventListener('contextmenu',e=>e.preventDefault());
  const km={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',Shift:'run'};
  window.addEventListener('keydown',e=>{
    if(km[e.key]){In[km[e.key]]=true;e.preventDefault();}
    else if(e.key==='e'||e.key===' '||e.key==='Enter'){if(near)interact(near);}
    else if(e.key==='n'||e.key==='N'){if(G.modal)closeNotes();else openNotes();}
    else if(e.key==='l'||e.key==='L'){if(!busy())P.dir=-P.dir;}
    else if(e.key==='Escape'){if(G.paused)pause(false);else pause(true);}
  });
  window.addEventListener('keyup',e=>{if(km[e.key])In[km[e.key]]=false;});
  window.addEventListener('blur',()=>{In.left=false;In.right=false;In.run=false;activeTouches.clear();sidePointers.left.clear();sidePointers.right.clear();sprintSide='';});
  window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,120));window.addEventListener('beforeunload',()=>{if(G.state==='play')save();});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(G.state==='play')save();Snd.suspend();if(G.state==='play'&&!G.modal)pause(true);}
    else{if(!G.paused)Snd.resume();}
  });
}

/* ---------- راه‌اندازی ---------- */
function boot(){
  loadSettings();buildTex();makePats(ctx);resize();initParticles();wireUI();
  try{if(navigator.getBattery)navigator.getBattery().then(b=>{G.battery=Math.round(b.level*100);}).catch(()=>{});}catch(e){}
  try{if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues)navigator.userAgentData.getHighEntropyValues(['model']).then(v=>{if(v&&v.model&&v.model.length>1)G.model=v.model;}).catch(()=>{});}catch(e){}
  showTitle();
  window.__n13={cam,G,P,SC,Mon,AN,FX,In,goto,interact,countDesk,desk13Event,readRegister,openSafe,bedAct,countTally,openFinalDoor,finalSeq,startChase,startStalk,update,render,kpPress,newGame,continueGame,Snd,hint,scare};
  requestAnimationFrame(frame);
}
boot();
